name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个分支连续推时，只保留最新的那次，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # safe_stem / 行名处理在 Windows 上语义不同（\ 也是路径分隔符），
          # 而项目主要在 Windows 上跑，所以单独验一遍
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 关键：用 --no-deps 跳过主依赖。
          # 主依赖里的 faster-whisper 会拖进 torch（2GB+），而单元测试
          # 全程不碰 ASR / ffmpeg / 模型调用，只需要下面这几个。
          # 装上 torch 的话这一步要从 1 分钟变成 10 分钟以上。
          pip install --no-deps -e .
          pip install "pandas>=2.0" "openpyxl>=3.1" "PyYAML>=6.0" "rich>=13.7" \
                      "pytest>=8.0" "ruff>=0.6,<1.0"

      - name: 静态检查（ruff lint）
        run: ruff check --output-format=github .

      - name: 格式检查（ruff format）
        run: ruff format --check --diff .

      - name: 单元测试
        run: pytest -v
