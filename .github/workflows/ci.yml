name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个分支连续推时，只保留最新的那次，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Windows runner 默认是 PowerShell，统一指定 bash 避免两套 shell 行为不一致
defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # safe_stem / 行名处理在 Windows 上语义不同（\ 也是路径分隔符），
          # 而项目主要在 Windows 上跑，所以单独验一遍
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: 装 uv（并指定 Python ${{ matrix.python-version }}）
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # 依赖装一次 30 秒上下，缓存起来能省一大半
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: 装中文字体
        # 封面渲染用例需要一个真实存在的中文字体，Linux runner 默认没有。
        # 缺字体时用例会自动 skip（不会变红），但那样就白跑一遍封面逻辑了。
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 装依赖
        # --all-extras 必须带：uv 按锁文件精确同步，不加会把 Pillow / fastapi /
        # rapidocr 这些可选依赖卸掉，封面与控制台的用例就全跳过了——
        # 一片绿但什么都没验到，这种「假绿」以前踩过一次。
        # --locked：pyproject 改了却忘了 uv lock，CI 直接红，别等到本地才发现问题。
        run: uv sync --all-extras --locked

      - name: 静态检查（ruff lint）
        run: uv run ruff check --output-format=github .

      - name: 格式检查（ruff format）
        run: uv run ruff format --check --diff .

      - name: 单元测试
        run: uv run pytest -v
